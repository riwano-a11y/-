name: Shinra Portal Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: shinra-portal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check website
        id: check
        continue-on-error: true
        shell: bash
        run: |
          curl             --fail             --silent             --show-error             --location             --max-time 20             --retry 2             --retry-delay 5             --user-agent "ShinraPortalMonitor/1.0 (+GitHub Actions)"             https://shinra-portal.com/             > /dev/null

      - name: Open outage issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 shinra-portal.com is down";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  "GitHub Actionsからサイトへの接続に失敗しました。",
                  "",
                  "- URL: https://shinra-portal.com/",
                  `- 検知日時 (UTC): ${new Date().toISOString()}`,
                  `- Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
                ].join("\n")
              });
            }

      - name: Close outage issue after recovery
        if: steps.check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 shinra-portal.com is down";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            for (const issue of issues.filter(issue => !issue.pull_request && issue.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ サイトが復旧しました。\n\n- 復旧確認日時 (UTC): ${new Date().toISOString()}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed"
              });
            }

      - name: Mark workflow failed
        if: steps.check.outcome == 'failure'
        shell: bash
        run: exit 1
