name: Shinra Portal Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_slack:
        description: "Slackへテスト通知を送る"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: shinra-portal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check website
        id: check
        continue-on-error: true
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --max-time 20 --retry 2 --retry-delay 5 \
            --user-agent "ShinraPortalMonitor/1.0 (+GitHub Actions)" \
            https://shinra-portal.com/ > /dev/null

      - name: Send Slack test notification
        if: inputs.test_slack == true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          payload=$(jq -n --arg text "✅ Shinra Portal監視のテスト通知です。Slack連携は正常です。\n対象: https://shinra-portal.com/" '{text: $text}')
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Open outage issue
        id: outage
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 shinra-portal.com is down";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  "GitHub Actionsからサイトへの接続に失敗しました。",
                  "",
                  "- URL: https://shinra-portal.com/",
                  `- 検知日時 (UTC): ${new Date().toISOString()}`,
                  `- Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
                ].join("\n")
              });
              core.setOutput("notify", "true");
            } else {
              core.setOutput("notify", "false");
            }

      - name: Notify Slack of outage
        if: steps.outage.outputs.notify == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          payload=$(jq -n --arg text "🚨 障害検知: https://shinra-portal.com/ に接続できません。\n確認: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{text: $text}')
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Close outage issue after recovery
        id: recovery
        if: steps.check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 shinra-portal.com is down";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const outages = issues.filter(issue => !issue.pull_request && issue.title === title);
            for (const issue of outages) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ サイトが復旧しました。\n\n- 復旧確認日時 (UTC): ${new Date().toISOString()}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed"
              });
            }
            core.setOutput("notify", outages.length > 0 ? "true" : "false");

      - name: Notify Slack of recovery
        if: steps.recovery.outputs.notify == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          payload=$(jq -n --arg text "✅ 復旧確認: https://shinra-portal.com/ は正常に応答しています。\n確認: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{text: $text}')
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Mark workflow failed
        if: steps.check.outcome == 'failure'
        shell: bash
        run: exit 1
