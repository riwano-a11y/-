name: Shinra Portal New Listing Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/site-monitor.yml"

permissions:
  contents: write

concurrency:
  group: shinra-portal-new-listing-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out monitor state
        uses: actions/checkout@v4

      - name: Detect new listings
        id: listings
        run: python3 scripts/check_new_listings.py

      - name: Notify Slack about new listings
        if: steps.listings.outputs.count != '0'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          jq -c '.[]' .monitor/new-shops.json | while IFS= read -r listing; do
            name=$(jq -r '.name' <<< "$listing")
            phone=$(jq -r '.phone' <<< "$listing")
            url=$(jq -r '.url' <<< "$listing")
            text=$(printf '新しくお店もしくは会社が掲載されました！\n店舗・会社名：%s\n電話番号：%s\n掲載ページ：%s' "$name" "$phone" "$url")
            payload=$(jq -n --arg text "$text" '{text: $text}')
            curl --fail --silent --show-error -X POST \
              -H "Content-Type: application/json" \
              --data "$payload" "$SLACK_WEBHOOK_URL"
          done

      - name: Save listing state
        if: steps.listings.outputs.count != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .monitor/seen-shops.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update known Shinra Portal listings"
            git push
          fi
